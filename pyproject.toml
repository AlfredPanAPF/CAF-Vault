[project]
name = "caf-graph"
version = "0.1.0"
description = "Self-updating company knowledge graph (vertical slice)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests",
    "beautifulsoup4",
    "lxml",
    "fastapi",
    "uvicorn",
    "jinja2",
    "anthropic",
]

[project.scripts]
graph = "graph.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph"]
