[project]
name = "caf-graph"
version = "0.1.0"
description = "Self-updating company knowledge graph (vertical slice)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests",
    "beautifulsoup4",
    "lxml",
    "fastapi",
    "uvicorn",
    "jinja2",
    "anthropic",
    # Claude Code subscription engine — pinned to the version Filter runs in
    # production; the wheel bundles a standalone CLI binary (no node needed).
    "claude-agent-sdk==0.2.128",
    "anyio",
]

[project.optional-dependencies]
# CPU whisper for Linux/Docker (CAF_ASR=faster-whisper); macOS dev uses
# mlx-whisper via uvx and doesn't need this.
asr = ["faster-whisper"]

[project.scripts]
graph = "graph.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph"]
