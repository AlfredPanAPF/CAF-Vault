[project]
name = "caf-graph"
version = "0.1.0"
description = "Self-updating company knowledge graph (vertical slice)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests",
    "beautifulsoup4",
    "lxml",
    "fastapi",
    "uvicorn",
    "python-multipart",   # FastAPI multipart parsing (POST /api/upload)
    "anthropic",
    # Claude Code subscription engine — pinned to the version Filter runs in
    # production; the wheel bundles a standalone CLI binary (no node needed).
    "claude-agent-sdk==0.2.128",
    "anyio",
    # sources overhaul (build spec v4): ticker resolution, YouTube transcripts,
    # and the Chrome TLS fingerprint the premium fetchers use. yt-dlp-ejs is
    # yt-dlp's JavaScript-challenge solver; it runs on the node binary the
    # Dockerfile copies out of the frontend stage.
    "yfinance>=1.6.0",
    "yt-dlp>=2026.7.4",
    "yt-dlp-ejs>=0.8.0",
    "curl-cffi>=0.16.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
# CPU whisper for Linux/Docker (CAF_ASR=faster-whisper); macOS dev uses
# mlx-whisper via uvx and doesn't need this.
asr = ["faster-whisper"]

[project.scripts]
graph = "graph.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph"]
